{% extends "base.html" %}
{% block title %}{% if hostel %}Edit Hostel{% else %}Add Hostel{% endif %} — HostelMS{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{% if hostel %}✏️ Edit Hostel{% else %}🏢 Add Hostel{% endif %}</h1>
    <div class="page-header__actions">
        <a href="{{ url_for('hostels_list') }}" class="btn btn--ghost">← Back</a>
    </div>
</div>

<div class="card form-card">
    <form method="POST" id="hostel-form">
        <div class="form-row">
            <div class="form-group">
                <label for="hostel_name">Hostel Name</label>
                <input type="text" name="hostel_name" id="hostel_name" class="form-control" value="{{ hostel.hostel_name if hostel else '' }}" required>
            </div>
            <div class="form-group">
                <label for="hostel_type">Type</label>
                <select name="hostel_type" id="hostel_type" class="form-control" required>
                    <option value="Boys" {% if hostel and hostel.hostel_type=='Boys' %}selected{% endif %}>Boys</option>
                    <option value="Girls" {% if hostel and hostel.hostel_type=='Girls' %}selected{% endif %}>Girls</option>
                    <option value="Co-ed" {% if hostel and hostel.hostel_type=='Co-ed' %}selected{% endif %}>Co-ed</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="warden_name">Warden Name</label>
                <input type="text" name="warden_name" id="warden_name" class="form-control" value="{{ hostel.warden_name if hostel else '' }}">
            </div>
            <div class="form-group">
                <label for="warden_phone">Warden Phone</label>
                <input type="text" name="warden_phone" id="warden_phone" class="form-control" value="{{ hostel.warden_phone if hostel else '' }}">
            </div>
        </div>
        <div class="form-group">
            <label for="address">Address</label>
            <textarea name="address" id="address" class="form-control" rows="2">{{ hostel.address if hostel else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn--primary" id="btn-submit">💾 {% if hostel %}Update{% else %}Save{% endif %} Hostel</button>
    </form>
</div>
{% endblock %}
