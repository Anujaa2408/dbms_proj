{% extends "base.html" %}
{% block title %}Add Student — HostelMS{% endblock %}

{% block content %}
<div class="page-header">
    <h1>🎓 Add Student</h1>
    <div class="page-header__actions">
        <a href="{{ url_for('students_list') }}" class="btn btn--ghost">← Back</a>
    </div>
</div>

<div class="card form-card">
    <form method="POST" action="{{ url_for('student_add') }}" id="student-form">
        <div class="form-row">
            <div class="form-group">
                <label for="registration_no">Registration No</label>
                <input type="text" name="registration_no" id="registration_no" class="form-control" required placeholder="RA2211003010XXX">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" class="form-control" required placeholder="student@srm.edu.in">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" name="first_name" id="first_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" name="last_name" id="last_name" class="form-control" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" name="phone" id="phone" class="form-control" placeholder="9XXXXXXXXX">
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <select name="gender" id="gender" class="form-control" required>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" name="department" id="department" class="form-control" placeholder="Computer Science">
            </div>
            <div class="form-group">
                <label for="year_of_study">Year of Study</label>
                <select name="year_of_study" id="year_of_study" class="form-control">
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year</option>
                    <option value="5">5th Year</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="date_of_birth">Date of Birth</label>
                <input type="date" name="date_of_birth" id="date_of_birth" class="form-control">
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select name="status" id="status" class="form-control">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label for="address">Address</label>
            <textarea name="address" id="address" class="form-control" rows="2"></textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="guardian_name">Guardian Name</label>
                <input type="text" name="guardian_name" id="guardian_name" class="form-control">
            </div>
            <div class="form-group">
                <label for="guardian_phone">Guardian Phone</label>
                <input type="text" name="guardian_phone" id="guardian_phone" class="form-control">
            </div>
        </div>
        <div style="margin-top:8px;">
            <button type="submit" class="btn btn--primary" id="btn-submit">💾 Save Student</button>
        </div>
    </form>
</div>
{% endblock %}
